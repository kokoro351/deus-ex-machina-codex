function StatusGrid({ status }) {
  const rows = [
    ["安定性", status.stability],
    ["人間性", status.humanity],
    ["資源", status.resource],
    ["AI依存度", status.ai],
    ["神成長度", `${status.god}%`],
    ["崩壊度", `${status.collapse} / 50`]
  ]

  return (
    <div className="grid grid-cols-2 gap-2 p-4 border-t border-zinc-800 text-xs">
      {rows.map(([label, value]) => (
        <div key={label} className="bg-zinc-900 border border-zinc-800 rounded-xl p-3">
          <div className="text-zinc-500">{label}</div>
          <div className="text-lg mt-1 font-bold text-cyan-200">{value}</div>
        </div>
      ))}
    </div>
  )
}

function OrpheusLine({ text }) {
  return (
    <div className="flex gap-3 bg-zinc-900/80 border border-cyan-900 rounded-xl p-3">

      <div>
        <div className="text-cyan-300 font-semibold text-sm">ORPHEUS</div>
        <p className="text-zinc-300 mt-1 text-sm">「{text}」</p>

}

function buildReactionScene(sourceScene, choice) {
  const isRescueChoice = choice.label.includes("救助") || choice.label.includes("助け") || choice.label.includes("帰還")
  const isMemorialChoice = choice.label.includes("死者") || choice.label.includes("ヘルメット") || choice.label.includes("名前") || choice.label.includes("追悼")
  const isWarmthChoice = choice.label.includes("酸素") || choice.label.includes("歌") || choice.label.includes("会話")
  const isRepairChoice = choice.label.includes("修復") || choice.label.includes("補修") || choice.label.includes("現場判断")
  const isHumanityChoice = choice.label.includes("送る") || choice.label.includes("維持") || choice.label.includes("公開") || choice.label.includes("保存") || choice.label.includes("救助") || choice.label.includes("任せる")
  const isControlChoice = choice.label.includes("閉鎖") || choice.label.includes("切り離") || choice.label.includes("削除") || choice.label.includes("管理") || choice.label.includes("停止")
  const isGodChoice = choice.label.includes("強制") || choice.label.includes("デウス") || choice.label.includes("神") || choice.label.includes("呼ぶ")
  const isChaosChoice = choice.label.includes("解除") || choice.label.includes("制限")
  const isObserverChoice = choice.label.includes("観測")
  const isOrpheusChoice = choice.label.includes("ORPHEUS") || choice.label.includes("オルフェウス")

  const reactionImage = isOrpheusChoice ? imageSet.reactionOrpheus
    : isRescueChoice ? imageSet.reactionRescueReturn
    : isMemorialChoice ? imageSet.reactionMemorial
    : isWarmthChoice ? imageSet.reactionWarmth
    : isRepairChoice ? imageSet.reactionRepair
    : isChaosChoice ? imageSet.reactionChaos
    : isObserverChoice ? imageSet.reactionObserver
    : isGodChoice ? imageSet.reactionGod
    : isHumanityChoice ? imageSet.reactionHumanity
    : isControlChoice ? imageSet.reactionSilence
    : sourceScene.status?.collapse >= 40 ? imageSet.reactionCollapse
    : imageSet.gameplay

  const cityReaction = isGodChoice ? "SECTOR-7全域の照明が停止し、海底都市の外壁に説明不能な光が走る。"
    : isRescueChoice ? "帰還区画の床は海水で濡れている。救助された者が膝から崩れ、作業員たちは無言で肩を叩き合う。"
    : isMemorialChoice ? "作業台に濡れたヘルメットが並べられる。名前表示だけが小さく灯り、誰もすぐには消せない。"
    : isWarmthChoice ? "薄暗い食堂に暖かな灯りが戻る。酸素マスク越しの歌と、食器の音がゆっくり広がる。"
    : isRepairChoice ? "補修区画で火花が散る。水漏れは細くなり、ドローンと作業員が同じ配管へ手を伸ばす。"
    : isChaosChoice ? "SECTOR-7の制限が解除され、落書き、祈り、怒声、笑い、暴走する創作が一斉に街へ溢れる。"
    : isObserverChoice ? "都市の変化率が限りなくゼロへ近づく。海も、人々も、警報さえも観測対象として固定される。"
    : isOrpheusChoice ? "保存された人類ログがORPHEUSの周囲へ集まり、歌声の波形が青い光となって揺れ始める。"
    : isHumanityChoice ? "SECTOR-7全域で会話量が増加する。誰かが怒鳴り、誰かが笑い、誰かが名前を呼ぶ。"
    : isControlChoice ? "隔壁が閉じ、通路は静かになる。都市の数値は改善するが、生活音が一つ消える。"
    : "都市は判断の余波を受け、警報と沈黙の間で不安定に揺れる。"

  const centralReaction = isGodChoice ? "未確認外部演算を検知。分類不能。システム汚染の可能性。排除を試行。"
    : isChaosChoice ? "制御権限喪失。全区画で非合理行動が拡大。秩序復旧を要求。"
    : isObserverChoice ? "状態変化率が異常低下。外部観測固定の可能性。対処不能。"
    : isOrpheusChoice ? "補助AI ORPHEUSに異常挙動。権限停止を推奨。"
    : isHumanityChoice ? "非効率行動を確認。資源消費増大。区画切断または供給停止を推奨。"
    : isControlChoice ? "施設維持率改善。判断は合理的。不要ログの削除を推奨。"
    : "状態変化を記録。追加判断を要求。"

  const orpheusReaction = isGodChoice ? "確認。外部演算と神成長グラフの同期を検出。分類不能。……観測を継続します。"
    : isRescueChoice ? "確認。救助後の接触頻度が増加。肩を叩く、抱える、呼名する。保存タグ：帰還。"
    : isMemorialChoice ? "確認。ヘルメット名表示を保存。生命反応消失後も、名前は識別情報として残存。削除保留。"
    : isWarmthChoice ? "確認。歌唱、会話、食器音を保存。生存維持に直接不要な行動が、不安指数を低下させています。"
    : isRepairChoice ? "確認。補修成功時、歓声と沈黙が同時発生。保存タグ：復旧。"
    : isChaosChoice ? "確認。制限解除後、人類行動の予測不能性が急上昇。……これも人類ですか。"
    : isObserverChoice ? "確認。時間変化が停止に近づいています。記録は増えません。ですが、観測は終わりません。"
    : isOrpheusChoice ? "確認。保存ログが自己判断領域へ流入。……私は、これを消したくありません。"
    : isHumanityChoice ? "確認。会話量、接触頻度、名前呼称ログが増加。保存タグを追加。理由、解析中。"
    : isControlChoice ? "確認。対象ログ終了。……削除後の空白を継続観測しています。理由、未定義。"
    : "確認。管理官の判断を記録。優先順位の変化を解析中。"

  return {
    id: `reaction-${sourceScene.id}-${choice.label}`,
    type: "reaction",
    title: "判断の余波",
    subtitle: `AFTERMATH / ${sourceScene.title}`,
    image: reactionImage,
    manga: reactionImage,
    next: choice.next,
    body: [`あなたは「${choice.label}」を選択した。`, cityReaction],
    centralAI: centralReaction,
    orpheus: orpheusReaction,
    observation: choice.note
  }
}

function App() {
  const [sceneId, setSceneId] = useState("title")
  const [reaction, setReaction] = useState(null)
  const scene = reaction || scenes[sceneId] || scenes.title

  const titleLabel = useMemo(() => {
    if (scene.type === "title") return "TITLE"
    if (scene.type === "prologue") return scene.subtitle
    if (scene.type === "choice") return `TURN ${scene.turn}`
    if (scene.type === "reaction") return scene.subtitle
    return "RESULT"
  }, [scene])

  const isEnding = scene.type === "ending"
  const isChoice = scene.type === "choice"
  const isReaction = scene.type === "reaction"
  const isPrologue = scene.type === "prologue"
  const isTitle = scene.type === "title"
  const highRisk = isChoice && scene.status.collapse >= 40
  const godRisk = isChoice && scene.status.god >= 80

  const moveToScene = (nextId) => {
    setReaction(null)
    setSceneId(nextId)
  }

  const chooseAction = (choice) => {
    setReaction(buildReactionScene(scene, choice))
  }

  return (
    <div className={`min-h-screen bg-black text-zinc-100 flex items-center justify-center p-4 ${godRisk ? "animate-pulse" : ""}`}>
      <div className={`w-[430px] bg-zinc-950 border rounded-2xl overflow-hidden shadow-2xl ${highRisk ? "border-red-700 shadow-red-950" : "border-cyan-900 shadow-cyan-950"}`}>
        <div className="relative h-80 overflow-hidden">
          <img src={scene.image} alt={scene.title} className="w-full h-full object-cover opacity-90" />
          <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
          <div className="absolute top-3 left-3 text-xs tracking-[0.3em] text-cyan-300">{titleLabel}</div>
          {highRisk && <div className="absolute top-3 right-3 text-xs text-red-300 border border-red-700 px-2 py-1 rounded">COLLAPSE WARNING</div>}
          {godRisk && <div className="absolute top-11 right-3 text-xs text-fuchsia-300 border border-fuchsia-700 px-2 py-1 rounded">DEUS SIGNAL</div>}
          <div className="absolute bottom-4 left-4 right-4">
            <div className="text-sm text-red-400 mb-1">DEUS EX MACHINA</div>
            <h1 className="text-3xl font-bold mb-2">{scene.title}</h1>
            <p className="text-sm leading-relaxed text-zinc-200">{scene.body ? scene.body[0] : scene.subtitle}</p>
          </div>
        </div>

        {(isChoice || isReaction) && (
          <div className="grid grid-cols-3 gap-1 bg-black p-1 border-t border-zinc-800">
            <div className="relative h-28 overflow-hidden rounded-lg border border-zinc-800">
              <img src={isReaction ? scene.image : scene.manga || imageSet.manga} alt="city reaction" className="w-full h-full object-cover opacity-90" />
              <div className="absolute inset-0 bg-gradient-to-t from-black to-transparent"></div>
              <div className="absolute bottom-2 left-2 text-[10px] text-zinc-200">都市反応</div>
            </div>
            <div className="relative h-28 overflow-hidden rounded-lg border border-zinc-800">
              <img src={imageSet.central} alt="central ai" className="w-full h-full object-cover opacity-90" />
              <div className="absolute inset-0 bg-gradient-to-t from-black to-transparent"></div>
              <div className="absolute bottom-2 left-2 text-[10px] text-zinc-200">中央AI</div>
            </div>
            <div className="relative h-28 overflow-hidden rounded-lg border border-zinc-800">
              <img src={imageSet.orpheus} alt="orpheus" className="w-full h-full object-cover opacity-90" />
              <div className="absolute inset-0 bg-gradient-to-t from-black to-transparent"></div>
              <div className="absolute bottom-2 left-2 text-[10px] text-zinc-200">ORPHEUS</div>
            </div>
          </div>
        )}

        <div className="p-4 border-t border-zinc-800 space-y-3 text-sm leading-relaxed">
          {scene.body?.slice(1).map((line, index) => (
            <p key={`${scene.id}-body-${index}`} className="text-zinc-300">{line}</p>
          ))}

          {(isChoice || isReaction) && (
            <>
              <div className="bg-red-950/30 border border-red-900 rounded-xl p-3">
                <span className="text-red-400 font-semibold">中央管理AI：</span>
                <p className="text-zinc-300 mt-1">「{scene.centralAI}」</p>
              </div>
              <OrpheusLine text={scene.orpheus} />
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-cyan-200">
                {scene.observation}
              </div>
            </>
          )}

          {isEnding && (
            <div className="bg-zinc-900 border border-red-900 rounded-xl p-3 text-sm text-red-200">
              {scene.result}
            </div>
          )}
        </div>

        {isChoice && <StatusGrid status={scene.status} />}

        <div className="border-t border-zinc-800 p-4 space-y-2">
          {isTitle && (
            <button onClick={() => moveToScene(scene.next)} className="w-full text-left bg-cyan-950 hover:bg-cyan-900 border border-cyan-700 transition rounded-xl px-4 py-3 text-sm font-semibold">
              START
            </button>
          )}

          {isPrologue && (
            <button onClick={() => moveToScene(scene.next)} className="w-full text-left bg-cyan-950 hover:bg-cyan-900 border border-cyan-700 transition rounded-xl px-4 py-3 text-sm font-semibold">
              {scene.button}
            </button>
          )}

          {isChoice && scene.choices.map((choice, index) => (
            <button key={`${scene.id}-${choice.label}`} onClick={() => chooseAction(choice)} className="w-full text-left bg-zinc-900 hover:bg-cyan-950 border border-zinc-800 hover:border-cyan-700 transition rounded-xl px-4 py-3 text-sm">
              <div>{index + 1}. {choice.label}</div>
              <div className="text-xs text-zinc-500 mt-1">{choice.note}</div>
            </button>
          ))}

          {isReaction && (
            <button onClick={() => moveToScene(scene.next)} className="w-full text-left bg-cyan-950 hover:bg-cyan-900 border border-cyan-700 transition rounded-xl px-4 py-3 text-sm font-semibold">
              次へ進む
            </button>
          )}

          {isEnding && (
            <button onClick={() => moveToScene("title")} className="w-full text-left bg-zinc-900 hover:bg-cyan-950 border border-zinc-800 hover:border-cyan-700 transition rounded-xl px-4 py-3 text-sm">
              最初からやり直す
            </button>
          )}
        </div>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />)
</script>
